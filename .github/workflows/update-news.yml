# ============================================
# GitHub Actions 工作流程設定檔
# 功能：自動更新新聞資料
# ============================================

# 工作流程名稱（會顯示在 GitHub Actions 頁面）
name: Auto Update News

# ============================================
# 觸發條件設定
# ============================================
on:
  # 定時觸發器
  schedule:
    # cron 表達式說明：
    # ┌───────────── 分鐘 (0 - 59)
    # │ ┌───────────── 小時 (0 - 23)
    # │ │ ┌───────────── 日期 (1 - 31)
    # │ │ │ ┌───────────── 月份 (1 - 12)
    # │ │ │ │ ┌───────────── 星期 (0 - 6，0 代表星期日)
    # │ │ │ │ │
    # * * * * *
    # 
    # '17 * * * *' = 每小時的第 17 分鐘執行，避開整點高負載時段
    - cron: '17 * * * *'
  
  # 手動觸發選項（可在 GitHub Actions 頁面手動執行）
  workflow_dispatch:

# ============================================
# 工作任務定義
# ============================================
permissions:
  contents: write

# Serialize cloud updates to news.json.
concurrency:
  group: update-news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 任務 ID：update-news
  update-news:
    # 指定執行環境：固定使用 Ubuntu 24.04
    runs-on: ubuntu-24.04
    
    # ============================================
    # 執行步驟（按順序執行）
    # ============================================
    steps:
      # --------------------------------------------
      # 步驟 1：檢出程式碼儲存庫
      # --------------------------------------------
      - name: Checkout repository
        # 使用 GitHub 官方提供的 checkout action（版本 7）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      # --------------------------------------------
      # 步驟 2：設定 Python 環境
      # --------------------------------------------
      - name: Set up Python
        # 使用 GitHub 官方提供的 Python 設定 action（版本 7）
        uses: actions/setup-python@v7
        with:
          # 指定 Python 版本為 3.10
          python-version: '3.10'
      
      # --------------------------------------------
      # 步驟 3：安裝 Python 相依套件
      # --------------------------------------------
      - name: Install dependencies
        # 執行 shell 指令
        run: |
          # 使用 pip 安裝所需的 Python 套件：
          # - requests：用於發送 HTTP 請求
          # - beautifulsoup4：用於解析 HTML 內容
          # - feedparser：用於解析 RSS/Atom 訂閱來源
          pip install requests beautifulsoup4 feedparser
      
      # --------------------------------------------
      # 步驟 4：執行爬蟲腳本
      # --------------------------------------------
      - name: Run scraper
        run: |
          # 執行 scraper.py 腳本來抓取新聞資料
          python scraper.py

      # --------------------------------------------
      # 步驟 5：提交並推送變更到儲存庫
      # --------------------------------------------
      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- news.json
          if git diff --cached --quiet; then
            exit 0
          fi
          # Refuse to publish any unexpected staged path.
          test "$(git diff --cached --name-only)" = 'news.json'
          git commit -m "Auto update news $(date '+%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Push failed after three attempts.' >&2
              exit 1
            fi
            git fetch origin "refs/heads/${GITHUB_REF_NAME}"
            # A real content conflict must stop the job.
            git rebase FETCH_HEAD
          done
